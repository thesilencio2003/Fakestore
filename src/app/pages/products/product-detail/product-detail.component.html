<div class="row mt-5">
    <div class="col-md-6 mb-4">
        <img
            [src]="product?.image"
            alt="Product"
            class="img-fluid rounded mb-3 product-image"
            id="mainImage"
        />
    </div>

    <div class="col-md-6">
        <h2 class="mb-3">{{ product?.title }}</h2>
        <div class="mb-3">
            <span class="h4 me-2">{{ product?.price | currency }}</span>
        </div>
        <div class="mb-3">
            <i class="bi bi-star-fill text-warning"></i>
            <i class="bi bi-star-fill text-warning"></i>
            <i class="bi bi-star-fill text-warning"></i>
            <i class="bi bi-star-fill text-warning"></i>
            <i class="bi bi-star-fill text-warning"></i>
            <span class="ms-2">
                >{{ product?.rating?.rate }} ({{ product?.rating?.count }}
                reviews)
            </span>
        </div>

        <p class="mb-4">{{ product?.description }}</p>
        <div class="mb-4">
            <h5>Category:</h5>
            <p class="mb-4">{{ product?.category }}</p>
        </div>
        <div class="mb-4">
            <label for="quantity" class="form-label">Quantity:</label>
            <input
                type="number"
                class="form-control"
                id="quantity"
                value="1"
                min="1"
                style="width: 80px;"
            />
        </div>
        <button class="btn btn-primary btn-lg mb-3 me-2">
            <i class="bi bi-cart-plus"></i> Add to Cart
        </button>
    </div>
</div>
